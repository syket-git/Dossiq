<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Dossiq logo">
  <title>Dossiq</title>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.3" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="0.75" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="spectrum2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.38" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#efeaff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#efeaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <g transform="translate(80 80)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <!-- Soft glow -->
      <circle r="50" fill="url(#spectrum)" filter="url(#glow)" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <!-- Orb body -->
      <circle r="44" fill="url(#spectrum)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="url(#spectrum2)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <!-- Light core -->
      <circle r="34" fill="url(#highlight)"/>
    </g>
  </g>
</svg>
